<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <defs>
    <!-- Guilloche Rosette Filter Pattern -->
    <pattern id="guilloche-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 Q 10,0 20,20 T 40,20" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
      <path d="M 0,20 Q 10,40 20,20 T 40,20" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
    </pattern>

    <!-- Holographic Rainbow Foil Gradient -->
    <linearGradient id="holo-foil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#ffeaa7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#55efc4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#81ecec" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#74b9ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Intaglio Texture Mask -->
    <filter id="intaglio-emboss">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
    </filter>

    <!-- Banknote Template: USD $20 Federal Reserve -->
    <g id="specimen-usd-20">
      <rect width="320" height="136" rx="4" fill="#e2ecd8" stroke="#1f4e2b" stroke-width="3"/>
      <rect x="6" y="6" width="308" height="124" fill="url(#guilloche-pattern)" color="#276738"/>
      <rect x="12" y="12" width="296" height="112" fill="none" stroke="#2d733f" stroke-width="1.5"/>
      <text x="24" y="44" font-family="serif" font-weight="bold" font-size="28" fill="#1b4d27">20</text>
      <text x="300" y="44" font-family="serif" font-weight="bold" font-size="28" fill="#1b4d27" text-anchor="end">20</text>
      <text x="160" y="32" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1b4d27" text-anchor="middle" letter-spacing="1">THE UNITED STATES OF AMERICA</text>
      <text x="160" y="46" font-family="serif" font-size="8" fill="#2d733f" text-anchor="middle">FEDERAL RESERVE NOTE</text>
      <!-- Portrait Oval -->
      <ellipse cx="160" cy="80" rx="36" ry="44" fill="#d2e3c8" stroke="#1b4d27" stroke-width="1.5"/>
      <circle cx="160" cy="74" r="18" fill="#2d733f" opacity="0.3"/>
      <!-- Treasury Seal & Serials -->
      <circle cx="80" cy="88" r="16" fill="none" stroke="#10b981" stroke-width="2"/>
      <text x="80" y="92" font-family="sans-serif" font-size="7" fill="#047857" text-anchor="middle" font-weight="bold">TREASURY</text>
      <text x="24" y="118" font-family="monospace" font-weight="bold" font-size="11" fill="#065f46" letter-spacing="1">MF 89234812 B</text>
      <text x="296" y="118" font-family="monospace" font-weight="bold" font-size="11" fill="#065f46" text-anchor="end" letter-spacing="1">MF 89234812 B</text>
    </g>

    <!-- Banknote Template: EUR €50 Europa -->
    <g id="specimen-eur-50">
      <rect width="320" height="176" rx="4" fill="#faebd7" stroke="#b45309" stroke-width="3"/>
      <rect x="6" y="6" width="308" height="164" fill="url(#guilloche-pattern)" color="#d97706"/>
      <text x="26" y="48" font-family="sans-serif" font-weight="900" font-size="34" fill="#b45309">50</text>
      <text x="160" y="36" font-family="sans-serif" font-weight="bold" font-size="14" fill="#92400e" text-anchor="middle">BCE ECB EЦБ EZB EKP EKT</text>
      <!-- Architectural Arch -->
      <path d="M 110,130 C 110,70 210,70 210,130" fill="none" stroke="#d97706" stroke-width="4"/>
      <!-- Emerald Number -->
      <rect x="24" y="110" width="48" height="34" rx="4" fill="#059669" stroke="#047857" stroke-width="1.5"/>
      <text x="48" y="134" font-family="sans-serif" font-weight="900" font-size="22" fill="#ecfdf5" text-anchor="middle">50</text>
      <!-- Hologram Foil Strip -->
      <rect x="265" y="12" width="40" height="152" fill="url(#holo-foil-grad)" rx="2" opacity="0.9"/>
    </g>

    <!-- Banknote Template: GBP £20 Polymer -->
    <g id="specimen-gbp-20">
      <rect width="320" height="168" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
      <rect x="6" y="6" width="308" height="156" fill="url(#guilloche-pattern)" color="#7c3aed"/>
      <text x="24" y="44" font-family="serif" font-weight="bold" font-size="28" fill="#5b21b6">£20</text>
      <text x="160" y="34" font-family="serif" font-weight="bold" font-size="12" fill="#5b21b6" text-anchor="middle">BANK OF ENGLAND</text>
      <!-- Large Polymer Clear Window -->
      <rect x="60" y="40" width="38" height="90" rx="19" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" fill-opacity="0.85"/>
      <circle cx="79" cy="65" r="10" fill="url(#holo-foil-grad)"/>
      <text x="79" y="115" font-family="sans-serif" font-size="8" font-weight="bold" fill="#6d28d9" text-anchor="middle">£20</text>
      <!-- J.M.W. Turner Tribute -->
      <circle cx="230" cy="85" r="32" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1"/>
      <text x="230" y="130" font-family="serif" font-style="italic" font-size="8" fill="#4c1d95" text-anchor="middle">J.M.W. Turner 1775-1851</text>
    </g>

    <!-- Banknote Template: MXN $500 Benito Juárez -->
    <g id="specimen-mxn-500">
      <rect width="320" height="142" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
      <rect x="6" y="6" width="308" height="130" fill="url(#guilloche-pattern)" color="#0284c7"/>
      <text x="24" y="42" font-family="sans-serif" font-weight="900" font-size="26" fill="#075985">500 Pesos</text>
      <text x="160" y="30" font-family="serif" font-weight="bold" font-size="12" fill="#0369a1" text-anchor="middle">BANCO DE MÉXICO</text>
      <circle cx="95" cy="80" r="30" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="180" y="40" width="8" height="85" fill="url(#holo-foil-grad)"/>
      <text x="240" y="115" font-family="sans-serif" font-weight="bold" font-size="18" fill="#0369a1">Mex$500</text>
    </g>
  </defs>
</svg>
